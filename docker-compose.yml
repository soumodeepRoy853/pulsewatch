services:
  postgres:
    image: postgres:17-alpine
    container_name: pulsewatch-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: pulsewatch
      POSTGRES_PASSWORD: pulsewatch_dev_password
      POSTGRES_DB: pulsewatch

    ports:
      - "5432:5432"

    volumes:
      - pulsewatch-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U pulsewatch -d pulsewatch"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: pulsewatch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pulsewatch-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pulsewatch-postgres-data:
  pulsewatch-redis-data: